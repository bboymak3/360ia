<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - 360 IA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; margin: 0; background: #f9f9f9; }
        nav { background: #111; color: white; padding: 15px; text-align: center; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        code { background: #222; color: #0f0; padding: 15px; display: block; border-radius: 5px; overflow-x: auto; font-size: 13px; line-height: 1.5; }
        .btn-copy { background: #0070f3; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <nav><h2 id="bienvenida">Panel 360 IA</h2></nav>
    <div class="container">
        <div class="box">
            <h3>🚀 Instalación Directa</h3>
            <p>Copia y pega este código justo antes de la etiqueta <code>&lt;/body&gt;</code> en tu sitio web:</p>
            <code id="scriptCode"></code>
            <button class="btn-copy" onclick="copiar()">Copiar Código</button>
        </div>
        <div class="box" style="text-align: center;">
            <button onclick="localStorage.clear(); window.location.href='/login.html';" style="background:none; border:none; color:red; cursor:pointer;">Cerrar Sesión</button>
        </div>
    </div>

    <script>
        const widgetId = localStorage.getItem('360ia_widgetId');
        const nombre = localStorage.getItem('360ia_nombre');
        
        if(!widgetId) window.location.href = '/login.html';
        
        document.getElementById('bienvenida').innerText = "Hola, " + nombre;
        
        // El código que el cliente debe pegar
        const codigoHtml = `<script src="https://360ia.estilosgrado33.workers.dev/widget.js?id=${widgetId}"><\/script>`;
        document.getElementById('scriptCode').innerText = codigoHtml;

        function copiar() {
            navigator.clipboard.writeText(codigoHtml);
            alert("¡Código copiado! Pégalo en tu web.");
        }
    </script>
</body>
</html>
